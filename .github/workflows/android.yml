name: API17 compatibility checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source and history checks
        run: python3 scripts/check_source_boundary.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint and API17 build
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:testApi17DebugUnitTest :common:testApi17DebugUnitTest :shared:testLegacyDebugUnitTest :common:testLegacyDebugUnitTest :shared:lintApi17Debug :common:lintApi17Debug :mobile:lintApi17Debug :mobile:assembleApi17Debug :mobile:assembleApi17DebugAndroidTest --stacktrace
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api17-test-reports
          if-no-files-found: ignore
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-api17Debug.html
            common/build/reports/lint-results-api17Debug.html
            shared/build/reports/lint-results-api17Debug.html
