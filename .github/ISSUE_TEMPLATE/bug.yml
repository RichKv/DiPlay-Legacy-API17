name: API17 compatibility issue
description: Report compilation, installation or interface-startup problems.
body:
  - type: input
    id: version
    attributes:
      label: APK version and device Android version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and observed error
      description: Review logs; do not include credentials or personal information.
    validations:
      required: true
